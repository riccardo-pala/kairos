[project]
name = "kairos-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.28,<1", "pydantic>=2,<3", "uvicorn>=0.34,<1"]

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kairos"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
