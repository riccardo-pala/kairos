name: Publish playground demo

on:
  push:
    branches: [main]
    paths:
      - backend/src/kairos/**
      - scripts/build_pages_demo.py
      - scripts/check_pages_demo.mjs
      - .github/workflows/pages-demo.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: .cache/pyodide
          key: pyodide-0.28.3
      - name: Build shared-code browser demo
        run: python scripts/build_pages_demo.py
      - name: Verify actual browser Python runtime
        run: node scripts/check_pages_demo.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
